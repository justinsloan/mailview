name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'build/**'
      - 'scripts/**'
      - 'samples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Saved attachments are marked as downloaded
        run: node scripts/quarantine-check.js

      - name: Smoke test (blocked content, attachments, remote images)
        env:
          MAILVIEW_LOG_REQUESTS: '1'
        run: npx electron scripts/smoke-test.js samples/phish-test.eml "$env:RUNNER_TEMP"

      - name: Build installers and zips
        env:
          # Optional code signing: set these repository secrets to sign the builds.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Launch the packaged app
        run: |
          $p = Start-Process dist\win-unpacked\MailView.exe -ArgumentList "`"$PWD\samples\phish-test.eml`"" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "MailView exited early with code $($p.ExitCode)" }
          Stop-Process -Name MailView -Force

      - name: SHA-256 checksums
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|zip)$' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mailview-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Saved attachments are marked as downloaded
        run: node scripts/quarantine-check.js

      - name: Smoke test (blocked content, attachments, remote images)
        env:
          MAILVIEW_LOG_REQUESTS: '1'
        run: npx electron scripts/smoke-test.js samples/phish-test.eml "$RUNNER_TEMP"

      - name: Build disk images and zips
        env:
          # Optional Developer ID signing and notarization: set these repository
          # secrets to use them. Without them the app is ad-hoc signed.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish never
          else
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi

      - name: Verify signature and launch the packaged app
        run: |
          app=dist/mac-arm64/MailView.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier|CodeDirectory)'
          "$app/Contents/MacOS/MailView" "$PWD/samples/phish-test.eml" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "MailView exited early"; exit 1; }
          kill "$pid"

      - name: SHA-256 checksums
        working-directory: dist
        run: shasum -a 256 *.dmg *.zip | tee SHA256SUMS-mac.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mailview-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-mac.txt
          if-no-files-found: error

  release:
    # Attach the Windows and macOS builds to the GitHub release for a pushed version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mailview-*
          merge-multiple: true
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "MailView ${TAG#v}" --notes ""
          gh release upload "$TAG" dist/* --clobber
