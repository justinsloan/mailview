name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'build/**'
      - 'scripts/**'
      - 'samples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test (blocked content, attachments, remote images)
        env:
          MAILVIEW_LOG_REQUESTS: '1'
        run: npx electron scripts/smoke-test.js samples/phish-test.eml "$env:RUNNER_TEMP"

      - name: Build installers and zips
        env:
          # Optional code signing: set these repository secrets to sign the builds.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: SHA-256 checksums
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|zip)$' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mailview-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  release:
    # Attach the Windows builds to the GitHub release for a pushed version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mailview-windows
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "MailView ${TAG#v}" --notes ""
          gh release upload "$TAG" dist/* --clobber
